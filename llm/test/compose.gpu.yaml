x-model: &model "hf.co/mmnga-o/llm-jp-4-8b-thinking-gguf:Q8_0"

services:
  llm:
    build:
      context: ..
    container_name: kklocalagent-test-llm
    environment:
      LLM_MODEL: *model
      OLLAMA_KEEP_ALIVE: "1h"
    ports:
      - "7050:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]

  probe:
    image: curlimages/curl:latest
    container_name: kklocalagent-test-llm-probe
    depends_on:
      llm:
        # Gated on the HEALTHCHECK in ../Dockerfile so this fires only
        # after the model pull completes.
        condition: service_healthy
    environment:
      MODEL: *model
    command:
      # $$MODEL escapes compose-level interpolation so the shell inside
      # the container expands it from the `environment:` above — a bare
      # ${MODEL} would silently become empty unless set on the host.
      - sh
      - -eu
      - -c
      - |
        echo "[probe] POST /api/chat model=$${MODEL}"
        curl -sS -X POST http://llm:11434/api/chat \
          -H 'Content-Type: application/json' \
          --data-raw "{\"model\":\"$${MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"日本の首都はどこですか？一言で答えてください。\"}],\"stream\":false}"
        echo

volumes:
  ollama-data:
