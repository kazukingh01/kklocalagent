services:
  probe:
    build:
      context: .
      dockerfile: Dockerfile.probe
    container_name: kklocalagent-test-wwd-probe
    environment:
      PROBE_WS_PORT: "9100"
      PROBE_HTTP_PORT: "9200"
      PROBE_TIMEOUT_SEC: "60"

  wwd:
    build:
      context: ..
    container_name: kklocalagent-test-wwd
    depends_on:
      - probe
    environment:
      WW_MIC_URL: ws://probe:9100
      WW_ORCHESTRATOR_URL: http://probe:9200/events
      WW_MODELS: alexa
      WW_THRESHOLD: "0.5"
      WW_COOLDOWN_SEC: "2.0"
      WW_INFERENCE_FRAMEWORK: tflite
