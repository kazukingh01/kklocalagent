services:
  wwd:
    build:
      context: ..
    container_name: kklocalagent-test-wwd-online
    environment:
      WW_MIC_URL: ws://${WINDOWS_HOST:-host.docker.internal}:7010/mic?ts=1
      WW_SINK_MODE: dry-run
      WW_MODELS: alexa
      WW_THRESHOLD: "0.5"
      WW_COOLDOWN_SEC: "2.0"
      WW_INFERENCE_FRAMEWORK: tflite
    extra_hosts:
      - "host.docker.internal:host-gateway"
