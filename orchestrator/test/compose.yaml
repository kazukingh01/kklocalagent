services:
  orch:
    build:
      context: ../..
      dockerfile: orchestrator/Dockerfile
    container_name: kklocalagent-test-orch
    environment:
      ORCH_ASR_URL: http://probe:9100/inference
      ORCH_LLM_URL: http://probe:9200/api/chat
      ORCH_LLM_MODEL: gemma3:4b
      ORCH_WAKE_REQUIRED: "false"
      RUST_LOG: info,orchestrator=debug

  probe:
    build:
      context: .
      dockerfile: Dockerfile.probe
    container_name: kklocalagent-test-orch-probe
    depends_on:
      - orch
    environment:
      PROBE_ORCH_URL: http://orch:7000
      PROBE_ASR_PORT: "9100"
      PROBE_LLM_PORT: "9200"
      PROBE_TIMEOUT_SEC: "30"
